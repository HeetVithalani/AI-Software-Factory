factory:
  version: "0.1.0"
  name: "AI Software Factory"
  default_profile: "balanced"
  max_concurrent_tasks: 2
  emergency_stop_file: ".factory_stop"
  log_level: "INFO"
  auto_approve_inherited: true

resources:
  total_ram_gb: 16.0
  total_vram_gb: 6.0
  max_inference_ram_gb: 10.0
  max_inference_vram_gb: 5.5

# OpenCode server runtime — lifecycle only, NOT model credentials
# model selection stays in models.yaml
opencode_runtime:
  host: "127.0.0.1"
  port: 7878
  startup_timeout_seconds: 10
  request_timeout_seconds: 120
  manage_server: true   # factory manages one opencode serve process
