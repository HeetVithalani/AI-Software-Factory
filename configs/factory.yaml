factory:
  version: "0.1.0"
  name: "AI Software Factory"
  default_profile: "balanced"
  max_concurrent_tasks: 2
  emergency_stop_file: ".factory_stop"
  log_level: "INFO"
  auto_approve_inherited: true

resources:
  total_ram_gb: 16.0
  total_vram_gb: 6.0
  max_inference_ram_gb: 10.0
  max_inference_vram_gb: 5.5
