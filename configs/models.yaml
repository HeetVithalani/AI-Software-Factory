# Default model for all factory agents.
# Format: "<provider>:<model>"  e.g. "ollama:qwen2.5-coder:7b"
# For opencode subprocess: "opencode:qwen2.5-coder:7b" (uses provider/model inside opencode)
default_model: "ollama:qwen2.5-coder:7b"

ollama:
  base_url: "http://localhost:11434"
  request_timeout_seconds: 120
  model_pull_enabled: false   # never auto-pull models

opencode:
  enabled: false
  base_url: ""
  api_key_env_var: "OPENCODE_API_KEY"
  allow_sensitive_data: false  # must be explicitly unlocked per project
