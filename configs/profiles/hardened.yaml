# Hardened profile — maximum security and quality gates
profile: hardened

quality:
  min_test_coverage: 95
  require_security_scan: true
  require_documentation: true
  require_code_review: true
  review_depth: "deep"
  require_second_reviewer: true
  require_audit_trail: true

scheduler:
  max_concurrent_tasks: 1   # serial execution for traceability
  task_timeout_seconds: 900

models:
  prefer_smaller: false
  max_vram_gb: 5.5

policies:
  # All approvals in hardened mode must be explicit (no scope inheritance)
  auto_approve_inherited: false
