[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-factory"
version = "0.1.0"
description = "Local-first AI software factory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.2,<2",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "typer>=0.27,<1",
    "rich>=15,<16",
    "httpx>=0.28,<1"
]

[tool.setuptools]
package-dir = {"" = "."}
